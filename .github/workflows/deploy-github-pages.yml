name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application (static)
        run: npm run build -- --configuration=github-pages
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Find and fix output
        id: fix-output
        run: |
          # Find the directory containing index.html or index.csr.html
          # This handles the nested output structure from Angular SSR
          OUTPUT_DIR=$(find dist -type f \( -name "index.html" -o -name "index.csr.html" \) | head -1 | xargs dirname)
          echo "Found output directory: $OUTPUT_DIR"
          
          # If index.csr.html exists but index.html doesn't, copy it
          if [ -f "$OUTPUT_DIR/index.csr.html" ] && [ ! -f "$OUTPUT_DIR/index.html" ]; then
            cp "$OUTPUT_DIR/index.csr.html" "$OUTPUT_DIR/index.html"
            echo "Copied index.csr.html to index.html"
          fi
          
          # Verify we have index.html
          if [ ! -f "$OUTPUT_DIR/index.html" ]; then
            echo "ERROR: No index.html found in $OUTPUT_DIR"
            find dist -type f -name "*.html" | head -20
            exit 1
          fi
          
          echo "Using output directory: $OUTPUT_DIR"
          echo "output_dir=$OUTPUT_DIR" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.fix-output.outputs.output_dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4